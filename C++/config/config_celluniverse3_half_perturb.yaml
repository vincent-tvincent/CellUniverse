  # post-PCA fit became an obvious rod.
  celluniverse3_post_pca_severe_rod_low_shape_rescue_enabled: true
  celluniverse3_post_pca_severe_rod_low_shape_rescue_min_current_shape: 2.40
  celluniverse3_post_pca_severe_rod_low_shape_rescue_min_elongation_jump: 1.35
  celluniverse3_post_pca_severe_rod_low_shape_rescue_min_future_both: 2
  celluniverse3_post_pca_severe_rod_low_shape_rescue_max_missing: 0
  celluniverse3_post_pca_severe_rod_low_shape_rescue_min_future_brightness: 0.025
  celluniverse3_post_pca_severe_rod_low_shape_rescue_min_parent_balance: 0.50
  celluniverse3_post_pca_severe_rod_low_shape_rescue_min_u_support: 0.60
  celluniverse3_post_pca_severe_rod_low_shape_rescue_max_region_penalty: 0.05
  celluniverse3_post_pca_severe_rod_low_shape_rescue_max_snap_abs: 6.0
  celluniverse3_post_pca_severe_rod_low_shape_rescue_max_snap_radius_scale: 0.15
  celluniverse3_post_pca_severe_rod_low_shape_rescue_require_tunnel: true
  celluniverse3_signal_center_future_cost_rescue_enabled: true
  celluniverse3_signal_center_future_cost_rescue_max_cost_abs: 45000
  celluniverse3_signal_center_future_cost_rescue_max_cost_fraction: 0.09
  celluniverse3_signal_center_future_cost_rescue_max_image_diff_abs: 22000
  celluniverse3_signal_center_future_cost_rescue_max_overlap_diff_abs: 90000
  celluniverse3_signal_center_future_cost_rescue_min_axis_length_scale: 0.50
  celluniverse3_signal_center_future_cost_rescue_max_drift_scale: 0.28
  celluniverse3_signal_center_future_cost_rescue_max_valley_from_bright: 1.05
  celluniverse3_signal_center_future_cost_rescue_max_gap_density: 0.45
  celluniverse3_signal_center_future_cost_rescue_positive_cost_min_parent_shape: 2.15
  celluniverse3_signal_center_future_cost_rescue_positive_cost_max_valley_from_bright: 0.90
  celluniverse3_signal_center_future_cost_rescue_positive_cost_max_gap_density: 0.26
  signal_center_severe_future_claim_enabled: true
  signal_center_severe_future_claim_min_parent_shape: 2.30
  signal_center_severe_future_claim_min_brightness: 0.055
  signal_center_severe_future_claim_min_parent_balance: 0.55
  signal_center_severe_future_claim_min_future_both: 2
  signal_center_severe_future_claim_max_missing: 0
  celluniverse3_tunnel_neighbor_claim_bypass_enabled: true
  celluniverse3_tunnel_neighbor_claim_min_parent_shape: 1.65
  celluniverse3_tunnel_neighbor_claim_min_future_brightness: 0.18
  celluniverse3_tunnel_neighbor_claim_min_parent_balance: 0.30
  celluniverse3_tunnel_neighbor_claim_min_future_both: 2
  celluniverse3_tunnel_neighbor_claim_max_missing: 0
