base_config: config_celluniverse3_server_fast.yaml

# High-RAM CellUniverse3 profile for this server.
#
# This machine has enough RAM to keep prepared CellUniverse3 frame stacks
# resident instead of pruning to the rolling future window. The fast profile
# remains the CPU/server throughput baseline; this overlay only changes the
# memory retention policy.
simulation:
  # Keep all prepared frame stacks in RAM for the duration of the run.
  # Disk cache remains enabled in the base profile as a recovery/backstop path,
  # but in-memory prepared frames should not be evicted by the CU3 pruning pass.
  celluniverse3_frame_cache_prune_enabled: false

  # Preserve the full CU3 lookahead policy from the fast profile for readers and
  # for any future code path that consults these limits when pruning is enabled.
  celluniverse3_frame_cache_keep_future: 20
  celluniverse3_frame_cache_pressure_keep_future: 20
  celluniverse3_frame_cache_min_available_gb: 64.0

# Runtime guardrail: this profile assumes the web backend caps concurrent
# CellUniverse workers to 3 when using a 32-thread worker cap. That keeps the
# scheduler-visible task count below 100 even when several jobs run in parallel.
