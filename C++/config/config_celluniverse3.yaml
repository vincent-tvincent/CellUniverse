base_config: config_celluniverse2_tuning.yaml

# Experimental CellUniverse 3.0 mode.
#
# CellUniverse3 implements the windowed max/sum split-guide idea:
# for frame n it builds local prior (n-m..n) and future (n..n+m) maps after
# local background subtraction, derives O=P&F, U=P|F, and D=F-P box evidence,
# then uses O->D as a soft split-axis prior and, when confident, as the primary
# deterministic split seed. The older current/future signal-center paths remain
# available as compatibility/fallback machinery, but CellUniverse3's own visual
# evidence comes from the map algebra below.
simulation:
  celluniverse3_enabled: true
  celluniverse3_window_radius: 3
  celluniverse3_window_background_percentile: 95.0
  celluniverse3_window_hot_percentile: 90.0
  celluniverse3_window_min_signal: 0.012
  celluniverse3_window_sum_gamma: 0.85
  celluniverse3_window_sum_epsilon: 0.05
  celluniverse3_window_initial_bright_fraction: 0.78
  celluniverse3_window_recursive_bright_fraction: 0.55
  celluniverse3_window_max_recursive_depth: 2
  celluniverse3_window_export_debug: false
  celluniverse3_window_merge_centers: false
  # Movement guidance from the same future local Wmax/Wsum maps:
  # allowed_region = dilate(Wmax > threshold), probability follows
  # (epsilon + normalized(Wsum)) ^ gamma.
  celluniverse3_window_guided_position_enabled: true
  celluniverse3_window_guided_iterations_per_cell: 50
  celluniverse3_window_guided_dilate_xy: 1
  celluniverse3_window_guided_sample_radius_scale: 1.0
  celluniverse3_window_guided_min_probability: 0.0001
  celluniverse3_window_map_split_prior_enabled: true
  celluniverse3_window_map_proposal_enabled: true
  celluniverse3_window_map_proposal_min_parent_shape: 1.35
  celluniverse3_window_map_proposal_min_sep_scale: 0.45
  celluniverse3_window_map_proposal_max_sep_scale: 2.75
  celluniverse3_window_map_min_u_support: 0.05
  celluniverse3_window_map_min_overlap_boxes: 1
  celluniverse3_window_map_min_future_only_boxes: 1
  celluniverse3_window_map_max_axis_angle_degrees: 75.0
  celluniverse3_window_map_center_penalty_fraction: 0.006
  celluniverse3_window_map_axis_penalty_fraction: 0.012
  celluniverse3_window_map_region_penalty_fraction: 0.020

