# Global settings
cellType: spheroid
#pixelsPerMicron: 1
#framesPerSecond: 1

# Cell settings
cell:
  x:
    prob: 0.45
    mu: 0
    sigma: 20
  y:
    prob: 0.45
    mu: 0
    sigma: 20
  z:
    prob: 0.35
    mu: 0
    sigma: 12
  majorRadius:
    prob: 0.2
    mu: 0
    sigma: 4
  minorRadius:
    prob: 0.2
    mu: 0
    sigma: 4
  thetaX:
    prob: 0.3
    mu: 0
    sigma: 0.1
  thetaY:
    prob: 0.3
    mu: 0
    sigma: 0.1
  thetaZ:
    prob: 0.3
    mu: 0
    sigma: 0.1
  minMajorRadius: 15
  maxMajorRadius: 60
  minMinorRadius: 5
  maxMinorRadius: 45

# Simulation settings
simulation:
  iterations_per_cell: 350
  background_color: 0.2 #auto-coliberation, tune won't work directly
  cell_color: 0.6 #auto-coliberation, tune won't work directly
  padding: 0
  z_scaling: 7
  # pre-processing parameters
  # blur sweep uses factors in [1, blur_sigma], where factor=1 means no blur
  blur_sigma: 10.0
  blur_sweep_step: 1.0
  sigmoid_k: 75.0
  sigmoid_center: 0.445 #auto-coliberation, tune won't work directly
  sigmoid_center_offset: 0.047
  # background calibration zone (must contain no cells)
  # (calibration_x, calibration_y, calibration_z) is the upper-left-front corner
  calibration_x: 20
  calibration_y: 20
  calibration_z: 0
  calibration_width: 50
  calibration_height: 31

# Probability of changes
prob:
  perturbation: 0.97
  split: 0.03
  split_cost: 1 # accpet more than -value
  split_elongation_threshold: 1.15 # relaxed gate to reduce false negatives on borderline splits
  split_gate_tolerance: 0.001
  min_relative_split_gain_base: 0.01
  min_relative_split_gain_strict: 0.02
  phase1_accept_rate_threshold: 0.02
  strong_split_cost_multiplier: 30.0
  strong_split_min_aspect_ratio: 1.4
  max_total_daughter_volume_ratio: 1.5
  brightness_update_ema_alpha: 0.35
  max_volume_growth_from_initial: 2.0
  enable_brightness_recovery: true
  nonsplit_shrink_trigger_ratio: 0.78
  nonsplit_recover_target_ratio: 0.90
  split_shrink_trigger_ratio: 0.55
  split_recover_target_ratio: 0.80
  brightness_retry_step: 0.02
  brightness_retry_max_attempts: 10
  brightness_retry_iters_per_attempt: 120
  brightness_retry_background_margin: 0.01
  brightness_retry_min_brightness_ratio: 0.9
#  combine: 0.1
#  camera_shift: 0.0

